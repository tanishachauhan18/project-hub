{% extends "base.html" %}
{% block title %}Reset Password – ProjectHub{% endblock %}

{% block public_content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      <div class="ph-card p-4 p-md-5 bg-white shadow-md rounded-4">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
            <i class="fas fa-key"></i>
          </div>
          <h3 class="font-heading mb-1">Forgot Password</h3>
          <p class="text-muted small">Enter your university email to receive recovery instructions</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold small">University Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fas fa-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="e.g. aarav.sharma@projecthub.edu" required autofocus>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-ph w-100 py-2 justify-content-center mt-2 mb-3">
            <i class="fas fa-paper-plane me-2"></i> Send Reset Link
          </button>
        </form>

        <div class="text-center pt-3 border-top">
          <a href="{{ url_for('auth.login') }}" class="small fw-bold text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
