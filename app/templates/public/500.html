{% extends "base.html" %}
{% block title %}Internal Error – ProjectHub{% endblock %}

{% block public_content %}
<div class="container py-5 text-center my-5">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h2 class="font-heading mb-3">Server Exception Encountered</h2>
    <p class="text-muted mb-4 max-w-600 mx-auto">An internal error occurred while processing your request. Please try again or return to the main dashboard.</p>
    <a href="{{ url_for('public.index') }}" class="btn btn-primary-ph px-4 py-2">
      <i class="fas fa-home me-2"></i> Return to Safety
    </a>
  </div>
</div>
{% endblock %}
