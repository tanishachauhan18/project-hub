{% extends "base.html" %}
{% block title %}Page Not Found – ProjectHub{% endblock %}

{% block public_content %}
<div class="container py-5 text-center my-5">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h2 class="font-heading mb-3">Resource or Page Not Found</h2>
    <p class="text-muted mb-4 max-w-600 mx-auto">The project, file, or portal URL you requested does not exist or has been relocated.</p>
    <a href="{{ url_for('public.index') }}" class="btn btn-primary-ph px-4 py-2">
      <i class="fas fa-home me-2"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
